[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odemehub"
version = "1.0.4"
description = "ödemehub ödeme geçidi için Python istemcisi."
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://dev.odemehub.com/"
Documentation = "https://dev.odemehub.com/"
Repository = "https://github.com/odemehub/python-sdk"
Issues = "https://github.com/odemehub/python-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
odemehub = ["py.typed"]
